lead: loop
model: sonnet
effort: medium
steps:
  - triage
  - spec: {optional: true}
  - spec-review: {optional: true}
  - gate: {name: gate1}
  - coder: {tests: true}
  - review
  - tester: {optional: true}
  - gate: {name: gate2}
  - shipper
  - pr
soak:
  latest: [1h, 4h]
  production: [1h, 4h, 24h]
done:
  on: soak.clean
  when: stage == production and checkpoint == 24h
